name: Task Reminder

on:
  schedule:
    # Запуск каждые 15 минут (со сдвигом, чтобы не попасть на перегрузку серверов)
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch: # Это позволит запускать скрипт вручную кнопкой

jobs:
  check-tasks:
    runs-on: ubuntu-latest
    steps:
      - name: Скачиваем код репозитория
        uses: actions/checkout@v4

      - name: Настраиваем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Устанавливаем библиотеки
        run: pip install requests

      - name: Запускаем скрипт
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_reminder.py
