name: Task Reminder

on:
  schedule:
    # Запуск каждые 5 минут (чтобы бот быстро реагировал на команды)
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch: # Ручной запуск

jobs:
  check-tasks:
    runs-on: ubuntu-latest
    # Даем разрешение на сохранение изменений в файлах
    permissions:
      contents: write

    steps:
      - name: Скачиваем код репозитория
        uses: actions/checkout@v4

      - name: Настраиваем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Устанавливаем библиотеки
        run: pip install requests

      - name: Запускаем скрипт
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_reminder.py

      - name: Сохраняем изменения (новые задачи) обратно в GitHub
        run: |
         git config --global user.name 'GitHub Action Bot'
         git config --global user.email 'action@github.com'
         git add tasks.json
         git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update tasks [skip ci]"
         git pull --rebase origin main
         git push
